<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OmniCalendar — Every Day Has a Story. Discover international observances, holidays, awareness days and fun celebrations." />
    <meta name="theme-color" content="#f6f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e15" media="(prefers-color-scheme: dark)" />
    <title>OmniCalendar — Every Day Has a Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply language direction and theme before paint to avoid a flash.
      (function () {
        var root = document.documentElement;
        try {
          var l = localStorage.getItem("omnicalendar:lang");
          if (l !== "ar" && l !== "en") l = /^ar\b/i.test(navigator.language || "") ? "ar" : "en";
          root.lang = l;
          root.dir = l === "ar" ? "rtl" : "ltr";
          if (l === "ar") document.title = "OmniCalendar — لكل يومٍ حكاية";
        } catch (e) {}
        try {
          var t = localStorage.getItem("omnicalendar:theme") || "system";
          var sys = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = t === "dark" || ((t === "system" || t === "glass") && sys);
          if (dark) root.classList.add("dark");
          if (t === "glass") root.classList.add("theme-glass");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
